name: build

# 用 GitHub 的 macOS runner 编译，本地零安装。
# 产物：ARHost.ipa（TrollStore 装）+ ARHost-app.zip（TrollFools 装）

on:
  push:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 安装 theos 与 iOS SDK
        run: |
          set -e
          export THEOS=$HOME/theos
          export PATH="/opt/homebrew/bin:$PATH"
          echo "=== environment ==="
          clang --version | head -1
          git --version
          brew install ldid || brew upgrade ldid || echo "ldid already present"
          echo "=== clone theos ==="
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS"
          echo "=== clone iOS SDKs ==="
          # theos ships a sdks dir already; cloning into it fails with exit 128
          rm -rf "$THEOS/sdks"
          git clone --depth=1 https://github.com/theos/sdks.git "$THEOS/sdks"
          echo "=== result ==="
          ls -d "$THEOS/sdks"/iPhoneOS*.sdk
          which ldid clang make

      - name: 静态自检
        run: python3 tools/preflight.py

      - name: 构建
        run: |
          set -e
          export THEOS=$HOME/theos
          export PATH="/opt/homebrew/bin:$PATH"
          make package

      - name: 校验产物
        run: |
          set -e
          echo "--- bundle contents ---"
          ls -la build/ARHost.app
          # TrollStore 会因为缺 Info.plist 报 error 302，这里提前拦死
          test -f build/ARHost.app/Info.plist || { echo "FATAL: Info.plist missing in bundle"; exit 1; }
          plutil -lint build/ARHost.app/Info.plist
          echo "--- ipa contents ---"
          unzip -l build/ARHost.ipa
          echo "--- arch (expect ARM64 / 0x0100000c) ---"
          for f in ARHost ARDaemon ARPayload.dylib; do
            printf '%-18s ' "$f"
            otool -hv "build/ARHost.app/$f" | awk 'NR==4{print $3, $4, $5}'
          done
          echo "--- entitlements ---"
          for f in ARHost ARDaemon; do
            echo "[$f]"
            ldid -e "build/ARHost.app/$f" || true
          done

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: ARHost-release
          path: |
            build/ARHost.ipa
            build/ARHost-app.zip
          if-no-files-found: error
